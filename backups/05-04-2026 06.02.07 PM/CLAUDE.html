<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLAUDE.md</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css"
        crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px 64px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; }
    }
    @media (prefers-color-scheme: light) {
      body { background: #ffffff; }
    }

    .markdown-body {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Keep images constrained within the column */
    .markdown-body img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    #error {
      max-width: 860px;
      margin: 80px auto;
      padding: 24px;
      border: 1px solid #f87171;
      border-radius: 6px;
      color: #b91c1c;
      background: #fef2f2;
      font-family: monospace;
      font-size: 14px;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      #error {
        background: #1f1010;
        border-color: #7f1d1d;
        color: #fca5a5;
      }
    }
  </style>
</head>
<body>
  <article class="markdown-body" id="content"></article>
  <div id="error"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"
        crossorigin="anonymous"></script>
<script>
  (function () {
    var content = document.getElementById('content');
    var errorBox = document.getElementById('error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    if (typeof marked === 'undefined') {
      showError('Failed to load marked.js from CDN. Check your network connection.');
      return;
    }

    // Custom renderer — adds id= to every heading so TOC anchors work
    var renderer = new marked.Renderer();
    renderer.heading = function (text, level) {
      // Generate anchor slug — same rules GitHub uses
      var slug = text
        .toLowerCase()
        .replace(/<[^>]+>/g, '')        // strip inline HTML
        .replace(/\s*—\s*/g, '-')       // em dash + surrounding spaces → single hyphen
        .replace(/[^\w\s-]/g, '')       // remove remaining special chars
        .trim()
        .replace(/\s+/g, '-')           // spaces to hyphens
        .replace(/-{2,}/g, '-')         // collapse multiple hyphens
        .replace(/^-+|-+$/g, '');       // trim leading/trailing hyphens
      return '<h' + level + ' id="' + slug + '">' + text + '</h' + level + '>';
    };

    marked.setOptions({ gfm: true, breaks: false, renderer: renderer });

    fetch('./CLAUDE.md')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — could not fetch README.md');
        return res.text();
      })
      .then(function (md) {
        content.innerHTML = marked.parse(md);
      })
      .catch(function (err) {
        showError('Could not load README.md: ' + err.message);
      });
  })();
</script>
</body>
</html>
